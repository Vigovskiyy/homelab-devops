---
- name: Deploy nginx stack
  hosts: docker
  become: true

  tasks:

    - name: Create app directory
      file:
        path: /opt/app
        state: directory

    - name: Copy compose file
      copy:
        src: ../roles/nginx/files/docker-compose.yml
        dest: /opt/app/docker-compose.yml

    - name: Run docker compose
      shell: docker compose up -d
      args:
        chdir: /opt/app
