- name: Create app directory
  file:
    path: /opt/nginx
    state: directory
  become: true

- name: Copy docker compose file
  copy:
    src: docker-compose.yml
    dest: /opt/nginx/docker-compose.yml
  become: true

- name: Start nginx container
  shell: docker compose up -d
  args:
    chdir: /opt/nginx
  become: true
