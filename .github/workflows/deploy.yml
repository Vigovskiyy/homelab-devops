name: Homelab Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Show inventory
        run: |
          cat ansible/inventory/hosts.ini

      - name: Run Ansible Ping
        run: |
          ansible -i ansible/inventory/hosts.ini all -m ping

      - name: Deploy nginx
        run: |
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/nginx.yml
